[project]
name = "xfriend"
version = "0.1.0"
description = "Offline desk companion robot: Mac brain + Swift face"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.4",
    "pyyaml>=6",
    "numpy>=1.26",
    "mlx-whisper>=0.4.3",
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.30.0",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
voice = [
    "mlx-whisper",
    "kokoro-onnx",
    "silero-vad",
    "pedalboard",
]
memory = [
    "sqlite-vec",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
